<!doctype html>
<html lang="en">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../css/main.css" />

    <script src="../custom-elements/photo-card.js"></script>
    <script>
      (function () {
        const storedTheme = localStorage.getItem("theme");
        const preferredTheme =
          storedTheme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-bs-theme", preferredTheme);
      })();
    </script>
    <title>Vassalboro Yesterday</title>
  </head>

  <body class="d-flex flex-column">
    <header class="sticky-top">
      <div class="mb-2 p-1 bg-dark text-white">
        <div class="container d-flex justify-content-between align-items-center">
          <span class="banner-author">by Neil</span>

          <div class="d-flex gap-2">
            <button id="themeToggle" type="button" class="btn btn-sm btn-dark" title="Toggle theme">
              <i class="bi bi-moon-stars"></i>
            </button>

            <button
              type="button"
              data-bs-toggle="modal"
              data-bs-target="#aboutModal"
              class="btn btn-dark btn-sm p-0 m-0"
            >
              <i class="bi bi-info-circle"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="container">
        <div class="card sticky-top shadow-sm mb-2">
          <div class="card-body pt-2 pb-2">
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="../index.html">Home</a></li>
                <li class="breadcrumb-item active">Vassalboro Yesterday</li>
              </ol>
            </nav>
          </div>
        </div>
      </div>
    </header>

    <div class="container flex-grow-1 d-flex flex-column overflow-hidden">
      <div class="row flex-shrink-0">
        <div class="col"></div>
      </div>
      <div class="row photo-grid-scroll flex-grow-1 overflow-auto">
        <div class="col-lg-4 col-md-12">
          <photo-card
            src="../assets/historical/CEM46575438_112974346896.jpg"
            description="
                Center Vassalboro Baptist Church, off Crowell Hill and Cross Hill Road. This building is now part of the
                American Baptist Churches of Maine.
            "
            date="October 2005"
            credit="Karlynn Gustafson"
            credit-url="https://www.findagrave.com/user/profile/46575438"
          >
          </photo-card>
          <photo-card
            src="../assets/historical/CEM46575438_112974322236.jpg"
            description="
              The sign for Center Vassalboro Baptist Church, off Crowell Hill Road.
            "
            date="October 2005"
            credit="Karlynn Gustafson"
            credit-url="https://www.findagrave.com/user/profile/46575438"
          ></photo-card>
          <photo-card
            src="../assets/historical/83003644_Photos.jpg"
            description="Philip Leach House, built 1805, off Hussey Hill Road. Considered a well-preserved example of a Federal style Cape House, which is a common
              architecture in New England, especially with older homes. 
            "
            date="1983"
            credit="Maine Historic Preservation Commission"
            credit-url="https://www1.maine.gov/mhpc/index.php/did-you-know/philip-leach-house-c1805-east-vassalboro-kennebec-county"
          >
          </photo-card>
        </div>
        <div class="col-lg-4 col-md-12">
          <photo-card
            src="../assets/historical/5927.jpg"
            description="A winter storm off Bog Road"
            credit="The Vassalboro Historical Society"
            credit-url="https://vassalboro.catalogaccess.com/photos/5354"
            date="1899"
          ></photo-card>

          <photo-card
            src="../assets/historical/taborhill.jpg"
            description="Taber Hill Road, looking towards Webber Pond."
            credit="Vassalboro Community Site"
            credit-url="https://www.vassalboro.com/gallery/aroundtown/aroundtown.html"
            date="Date unknown. 2000 or before"
          ></photo-card>
        </div>
        <div class="col-lg-4 col-md-12">
          <photo-card
            src="../assets/historical/700.jpg"
            description="The Revere House off Main St (Route 32)."
            credit="The Vassalboro Historical Society"
            credit-url="https://vassalboro.catalogaccess.com/photos/7260"
            date="January 2003"
          ></photo-card>

          <photo-card
            src="../assets/historical/6227.jpg"
            description="The sign for China Lake off the East Vassalboro boat landing."
            credit="The Vassalboro Historical Society"
            credit-url="https://vassalboro.catalogaccess.com/photos/5682"
            date="July 1967"
          ></photo-card>
        </div>
      </div>
    </div>
    <script src="../custom-elements/theme-toggle.js"></script>
  </body>
</html>
