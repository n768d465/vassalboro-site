<html lang="en">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../css/main.css" />

    <script src="../custom-elements/photo-card.js"></script>
    <script>
      (function () {
        const storedTheme = localStorage.getItem("theme");
        const preferredTheme =
          storedTheme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-bs-theme", preferredTheme);
      })();
    </script>

    <title>About</title>
  </head>

  <body class="d-flex flex-column">
    <header class="sticky-top">
      <div class="mb-2 p-1 bg-dark text-white">
        <div class="container d-flex justify-content-between align-items-center">
          <span class="banner-author">by Neil</span>

          <div class="d-flex gap-2">
            <button id="themeToggle" type="button" class="btn btn-sm btn-dark" title="Toggle theme">
              <i class="bi bi-moon-stars"></i>
            </button>

            <button
              type="button"
              data-bs-toggle="modal"
              data-bs-target="#aboutModal"
              class="btn btn-dark btn-sm p-0 m-0"
            >
              <i class="bi bi-info-circle"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="container">
        <div class="card sticky-top shadow-sm mb-2">
          <div class="card-body pt-2 pb-2">
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="../index.html">Home</a></li>
                <li class="breadcrumb-item active">About</li>
              </ol>
            </nav>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div class="container">
        <div class="row">
          <div class="col">
            <div class="card shadow">
              <div class="card-body">
                This website was inspired by my father, who made a website of Virgil, Kansas, where my mom is from. It
                was made in the 90s, and is <a href="https://www.kancoll.org/graphics/virgil/">still up today!</a>
                <br /><br />
                I will add more photos here over time. Thank you for visiting.
                <br /><br />- Neil
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
